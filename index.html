<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arjun Atwal</title>
  <meta name="description" content="Arjun Atwal — software engineer building production systems across payments, biotech, geospatial, and generative AI.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #161311;
      --ink: #ece6dc;
      --ink-bright: #f7f1e8;
      --muted: #b8ada0;
      --faint: #8a7e72;
      --line: rgba(236, 230, 220, 0.12);
      --accent: #e0a45a;
      --accent-dim: rgba(224, 164, 90, 0.12);
      --spot: rgba(224, 164, 90, 0.14);
      --font: "Inter", system-ui, sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font);
      font-size: 1rem;
      line-height: 1.7;
      color: var(--muted);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: radial-gradient(
        600px circle at var(--spot-x, 50%) var(--spot-y, 20%),
        var(--spot),
        transparent 80%
      );
    }

    a {
      color: var(--ink);
      text-decoration: none;
      transition: color 0.2s var(--ease);
    }

    a:hover { color: var(--accent); }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    h1, h2, h3 {
      color: var(--ink-bright);
      letter-spacing: -0.025em;
      line-height: 1.2;
      margin: 0;
    }

    p { margin: 0; }

    .landing {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 1.5rem;
      max-width: 600px;
      width: 100%;
    }

    .landing h1 {
      font-size: clamp(2.4rem, 5vw, 3.2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink-bright);
      margin-bottom: 0.4rem;
    }

    .landing .role {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }

    .landing .lede {
      color: var(--muted);
      max-width: 28rem;
      margin: 0 auto 3rem;
      font-size: 0.95rem;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.7rem 1.6rem;
      border-radius: 0.4rem;
      font-family: var(--font);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 0.2s var(--ease), color 0.2s var(--ease), box-shadow 0.2s var(--ease), border-color 0.2s var(--ease);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg);
      border: 1px solid var(--accent);
    }

    .btn-primary:hover {
      background: transparent;
      color: var(--accent);
    }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-outline:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px rgba(224, 164, 90, 0.08);
    }

    .btn svg {
      width: 0.85rem;
      height: 0.85rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      transition: transform 0.2s var(--ease);
    }

    .btn:hover svg {
      transform: translate(0.1rem, -0.1rem);
    }

    .socials {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.15rem;
      margin-top: 3rem;
      list-style: none;
      padding: 0;
    }

    .socials a {
      color: var(--faint);
      display: flex;
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: var(--ink-bright);
    }

    .socials svg {
      width: 1.4rem;
      height: 1.4rem;
      fill: currentColor;
    }

    @media (max-width: 480px) {
      .landing h1 { font-size: 2rem; }
      .btn-group { flex-direction: column; align-items: center; }
      .btn { width: 100%; justify-content: center; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      body::before { display: none; }
    }
  </style>
</head>
<body>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 2h-17A1.5 1.5 0 0 0 2 3.5v17A1.5 1.5 0 0 0 3.5 22h17a1.5 1.5 0 0 0 1.5-1.5v-17A1.5 1.5 0 0 0 20.5 2ZM8 19H5v-9h3ZM6.5 8.4A1.7 1.7 0 1 1 8.2 6.7 1.7 1.7 0 0 1 6.5 8.4ZM19 19h-3v-4.7c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9V19H9v-9h2.9v1.3a3.2 3.2 0 0 1 2.9-1.6c3.1 0 3.7 2 3.7 4.7Z"/></svg>

    </li>
  </ul>
</div>

<script>
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduceMotion) {
    window.addEventListener("pointermove", (e) => {
      document.body.style.setProperty("--spot-x", `${e.clientX}px`);
      document.body.style.setProperty("--spot-y", `${e.clientY}px`);
    }, { passive: true });
  }
</script>

</html>
