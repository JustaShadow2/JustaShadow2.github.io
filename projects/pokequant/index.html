<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PokéQuant — Pokémon Alternative-Assets Research</title>
    <meta http-equiv="refresh" content="0; url=https://pokequant-web.onrender.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Inter", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #161311;
        color: #ece6dc;
      }
      .container { text-align: center; padding: 40px; }
      h1 { font-size: 24px; margin-bottom: 8px; }
      p { color: #b8ada0; margin-bottom: 24px; }
      a {
        display: inline-block;
        padding: 12px 28px;
        background: #e0a45a;
        color: #161311;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: filter 0.15s;
      }
      a:hover { filter: brightness(1.08); }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>PokéQuant</h1>
      <p>Redirecting to the research terminal...</p>
      <a href="https://pokequant-web.onrender.com/">Open PokéQuant -&gt;</a>
    </div>
  </body>
</html>
